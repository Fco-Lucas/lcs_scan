spring.application.name=scan
server.port=8181

# LOCALE
spring.mvc.locale-resolver=fixed
spring.mvc.locale=pt_BR

# SQL Config
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none

# Flyway configurations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.baseline-on-migrate=true

# SpringDoc OpenApi & Swagger
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/docs-scan.html
springdoc.api-docs.path=/docs-scan
springdoc.packagesToScan=com.lcsz.scan.controllers

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:uploads/

